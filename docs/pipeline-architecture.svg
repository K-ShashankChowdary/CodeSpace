<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <!-- Title -->

<text x="500" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Online Code Execution Pipeline (Producer &#8594; Consumer)</text>

  <!-- Lane labels -->

<text x="40" y="95" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">REQUEST PATH</text>
<text x="40" y="340" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">VERDICT PATH</text>

  <!-- Client -->
  <rect x="20" y="110" width="150" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">React Client</text>
  <text x="95" y="158" text-anchor="middle" font-size="11" fill="#3b5578">Monaco editor</text>

  <!-- API -->
  <rect x="240" y="110" width="170" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="325" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Node.js API</text>
  <text x="325" y="152" text-anchor="middle" font-size="11" fill="#3f6b4a">Producer</text>
  <text x="325" y="167" text-anchor="middle" font-size="10" fill="#5b8a68">POST /api/execute</text>

  <!-- Redis -->
  <rect x="480" y="110" width="170" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="565" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Redis Queue</text>
  <text x="565" y="152" text-anchor="middle" font-size="11" fill="#8a4646">Upstash</text>
  <text x="565" y="167" text-anchor="middle" font-size="10" fill="#a56060">jobId enqueued</text>

  <!-- Worker -->
  <rect x="720" y="110" width="150" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="795" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#a16207">C++ Worker</text>
  <text x="795" y="152" text-anchor="middle" font-size="11" fill="#8a7440">Consumer</text>
  <text x="795" y="167" text-anchor="middle" font-size="10" fill="#a08a54">long-polls queue</text>

  <!-- Docker sandbox -->
  <rect x="720" y="230" width="150" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="795" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Docker Sandbox</text>
  <text x="795" y="273" text-anchor="middle" font-size="10" fill="#5b56a8">cgroups + setrlimit</text>
  <text x="795" y="288" text-anchor="middle" font-size="10" fill="#5b56a8">fork / execvp / wait4</text>

  <!-- top row arrows -->
  <line x1="170" y1="145" x2="238" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="145" x2="478" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="145" x2="718" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

<text x="204" y="135" text-anchor="middle" font-size="9.5" fill="#64748b">source code</text>
<text x="444" y="135" text-anchor="middle" font-size="9.5" fill="#64748b">enqueue O(1)</text>
<text x="684" y="135" text-anchor="middle" font-size="9.5" fill="#64748b">dequeue job</text>

  <!-- worker down to docker -->
  <line x1="795" y1="180" x2="795" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="855" y="208" text-anchor="middle" font-size="9.5" fill="#64748b">spawn</text>

  <!-- Return path: Docker -> Worker -> Socket.io -> API -> Client -->
  <rect x="240" y="230" width="170" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="325" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Node.js API</text>
  <text x="325" y="273" text-anchor="middle" font-size="10" fill="#3f6b4a">Socket.io broadcast</text>
  <text x="325" y="288" text-anchor="middle" font-size="10" fill="#3f6b4a">event: "verdict"</text>

  <rect x="20" y="230" width="150" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">React Client</text>
  <text x="95" y="276" text-anchor="middle" font-size="10" fill="#3b5578">WebSocket push</text>
  <text x="95" y="292" text-anchor="middle" font-size="10" fill="#3b5578">AC / WA / TLE / MLE</text>

  <!-- reverse arrows -->
  <line x1="720" y1="270" x2="412" y2="270" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="238" y1="270" x2="172" y2="270" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

<text x="565" y="260" text-anchor="middle" font-size="9.5" fill="#0f766e">exit code (0 / 137 / 139)</text>
<text x="204" y="260" text-anchor="middle" font-size="9.5" fill="#0f766e">verdict payload</text>

  <!-- bottom notes -->
  <rect x="20" y="360" width="850" height="95" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="384" font-size="12" font-weight="700" fill="#334155">Isolation &amp; verdict integrity</text>
  <text x="40" y="404" font-size="11" fill="#475569">Verdicts are derived strictly from POSIX exit codes, never from parsed stdout &#8212; immune to output-spoofing.</text>
  <text x="40" y="422" font-size="11" fill="#475569">Fork bombs and OOM are stopped at the kernel level via cgroups (--memory, --pids-limit) and setrlimit (RLIMIT_CPU).</text>
  <text x="40" y="440" font-size="11" fill="#475569">If a worker dies mid-job, the Redis queue retains the entry until a new worker (spun up by the autoscaler) claims it.</text>
</svg>