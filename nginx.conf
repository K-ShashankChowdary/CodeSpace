#/etc/nginx/sites-enabled/codespace
# 1. Map block to dynamically handle 'Upgrade' header for WebSockets
# This MUST be present for `$connection_upgrade` to work.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name codespace-api.duckdns.org;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# 3. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codespace-api.duckdns.org;

    # SSL Certificates (Let's Encrypt - fixed the truncated .pem extensions)
    ssl_certificate /etc/letsencrypt/live/codespace-api.duckdns.org/fullchain.p>
    ssl_certificate_key /etc/letsencrypt/live/codespace-api.duckdns.org/privkey>

    # 4. ONE Unified Block for both API and WebSockets
    location / {
        # proxy_pass to the local port your Node.js pm2 cluster is running on
        proxy_pass http://127.0.0.1:5000;

        # WebSocket Upgrade Headers (CRITICAL)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🚨 PASS THE AUTHENTICATION COOKIE (CRITICAL FOR YOUR JWT)
        proxy_set_header Cookie $http_cookie;

        # Prevent Nginx from closing the WebSocket connection early (10 minutes)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}


